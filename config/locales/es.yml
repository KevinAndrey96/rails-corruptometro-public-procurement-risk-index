      index_title: Índice de la entidad
      index_body: Es el promedio de los puntajes de sus contratos ponderado por valor, para que un contrato grande pese más que uno pequeño.
      levels_title: Niveles de riesgo
      levels_body: "Bajo de 0 a 24, medio de 25 a 49 y alto de 50 a 100."
      flags_title: Banderas rojas
      weight: Peso
      windows_title: Ventanas de Ley de Garantías
