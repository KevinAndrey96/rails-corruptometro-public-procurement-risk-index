      contract:
        create: Registrar contrato
        update: Guardar cambios
      entity:
        create: Registrar entidad
        update: Guardar cambios
      contractor:
        create: Registrar contratista
        update: Guardar cambios

  risk_levels:
    badge: "%{score} · %{level}"
    low: riesgo bajo
    medium: riesgo medio
    high: riesgo alto

  red_flags:
    additions_over_cap:
      name: Adiciones superiores al 50 %
      description: Las adiciones superan la mitad del valor inicial del contrato, el tope legal para contratos estatales.
      legal_basis: Ley 80 de 1993, artículo 40, parágrafo
    single_bidder:
      name: Oferente único
      description: Un proceso competitivo terminó con un solo proponente, lo que anula la competencia que justifica la modalidad.
      legal_basis: Ley 1150 de 2007, artículo 2 (modalidades de selección)
    direct_award:
      name: Contratación directa
      description: El contrato se adjudicó sin proceso competitivo. Es legal en causales taxativas, pero concentra el riesgo.
      legal_basis: Ley 1150 de 2007, artículo 2, numeral 4
    new_contractor:
      name: Contratista recién constituido
      description: La empresa se constituyó menos de un año antes de firmar el contrato y no acredita trayectoria.
      legal_basis: Decreto 1082 de 2015, requisitos habilitantes de experiencia
    contractor_concentration:
      name: Concentración en un contratista
      description: Un solo contratista acumula más del 40 % del valor contratado por la entidad.
      legal_basis: Ley 1474 de 2011 (Estatuto Anticorrupción), principio de selección objetiva
    electoral_restriction:
      name: Contratación directa en Ley de Garantías
      description: Contrato directo firmado dentro de los cuatro meses previos a la elección presidencial y hasta la segunda vuelta.
      legal_basis: Ley 996 de 2005, artículo 33

