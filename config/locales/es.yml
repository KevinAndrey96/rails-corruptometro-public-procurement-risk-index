es:
  app:
    name: Corruptómetro
    tagline: Índice de riesgo en la contratación pública colombiana
    description: Corruptómetro calcula banderas rojas e índices de riesgo de corrupción en la contratación pública de Colombia a partir de datos estilo SECOP II.
    navigation: Navegación principal
    admin_navigation: Administración
    sign_in: Ingresar
    sign_out: Cerrar sesión
    cancel: Cancelar
    edit: Editar
    destroy: Eliminar
    save: Guardar
    apply: Filtrar
    clear: Limpiar
    all: Todos
    disclaimer: Los datos de demostración son ficticios. Un puntaje alto es una alerta para revisar el contrato, no una prueba de corrupción.
    footer: Proyecto de código abierto de Kevin Andrey Herrera Silva.
    source_code: Código fuente
    form_errors:
      one: "Revisa el formulario: hay 1 error."
      other: "Revisa el formulario: hay %{count} errores."
    pagination:
      label: Paginación
      previous: Anterior
      next: Siguiente
      summary: Página %{page} de %{pages} · %{count} registros

  nav:
    dashboard: Panel
    entities: Entidades
    contracts: Contratos
    methodology: Metodología
    admin: Administrar
    imports: Importar CSV

  helpers:
    money:
