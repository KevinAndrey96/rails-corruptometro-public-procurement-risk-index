      api_title: API pública
      api_body: "Los mismos datos están disponibles en JSON, sin autenticación y con límite de 120 solicitudes por minuto:"
      limits_title: Limitaciones
      limits_body: Las banderas son indicadores estadísticos inspirados en la literatura de riesgo de corrupción. Un puntaje alto amerita revisión; no prueba irregularidades.

